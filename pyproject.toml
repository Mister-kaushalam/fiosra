[project]
name = "fiosra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "neo4j>=5.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sympy>=1.13.0",
    "litellm>=1.80,<2",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "graphiti-core>=0.30.2",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
